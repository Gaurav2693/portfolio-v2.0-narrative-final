# Runs on every push and PR: typecheck + production build.
# Vercel's Git integration does the deploying (branch → preview, main → gauravmishra.design);
# this just makes a broken build show up as a red check before it ships.
name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
